<style>
:root{
  --navy-950:#0B1526; --navy-900:#102038; --navy-800:#18304F; --navy-600:#2D4C78;
  --accent:#2B5C9E; --accent-strong:#1F4A85; --accent-soft:#E3ECF8;
  --ink:#172131; --ink-2:#3B475A; --muted:#5E6B80; --line:#D7DDE6; --line-2:#E7EBF1;
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FB; --glass:rgba(255,255,255,.78);
  --ok:#2A7656; --ok-soft:#E1F1E9; --warn:#9A630E; --warn-soft:#FBF0DC; --bad:#A3382A; --bad-soft:#F8E4E0; --info:#2B5C9E; --info-soft:#E3ECF8;
  --neutral-soft:#ECEFF3;
  --radius-s:4px; --radius-m:8px; --radius-l:12px;
  --shadow:0 1px 2px rgba(16,32,56,.06),0 4px 14px rgba(16,32,56,.05);
  --focus:0 0 0 3px rgba(43,92,158,.45);
  --font:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --accent:#7FA8E3; --accent-strong:#A6C3EE; --accent-soft:#1C2F4C;
    --ink:#E4E9F1; --ink-2:#C2CBD8; --muted:#94A1B5; --line:#2A3A52; --line-2:#22324A;
    --bg:#0C1420; --surface:#121D2E; --surface-2:#172437; --glass:rgba(18,29,46,.82);
    --ok:#6CC59C; --ok-soft:#173528; --warn:#E3B05A; --warn-soft:#3A2C12; --bad:#EE8C7D; --bad-soft:#3E1D18; --info:#7FA8E3; --info-soft:#1C2F4C;
    --neutral-soft:#1E2B40; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --focus:0 0 0 3px rgba(127,168,227,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --accent:#7FA8E3; --accent-strong:#A6C3EE; --accent-soft:#1C2F4C;
  --ink:#E4E9F1; --ink-2:#C2CBD8; --muted:#94A1B5; --line:#2A3A52; --line-2:#22324A;
  --bg:#0C1420; --surface:#121D2E; --surface-2:#172437; --glass:rgba(18,29,46,.82);
  --ok:#6CC59C; --ok-soft:#173528; --warn:#E3B05A; --warn-soft:#3A2C12; --bad:#EE8C7D; --bad-soft:#3E1D18; --info:#7FA8E3; --info-soft:#1C2F4C;
  --neutral-soft:#1E2B40; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --focus:0 0 0 3px rgba(127,168,227,.55);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body,#app{height:100%}
body{margin:0;font-family:var(--font);font-size:14.5px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:600}
h1{font-size:1.35rem;letter-spacing:-.01em} h2{font-size:1.08rem} h3{font-size:.98rem}
p{margin:.3rem 0}
.num,td.num,.tabular{font-variant-numeric:tabular-nums}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--radius-s)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--surface);padding:8px 12px;border-radius:var(--radius-m)}
.skip:focus{left:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;height:100%}
.shell.collapsed{grid-template-columns:64px 1fr}
.sidebar{background:var(--navy-900);color:#D5DEEC;display:flex;flex-direction:column;min-height:0;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-mark{width:32px;height:32px;border-radius:7px;background:linear-gradient(140deg,#3B6CB0,#1E3A63);display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px;flex:none;letter-spacing:.02em}

.brand-name{font-weight:600;color:#fff;line-height:1.15}
.brand-name small{display:block;font-weight:400;color:#9FB0C8;font-size:12px}
.nav{list-style:none;margin:0;padding:10px 8px;overflow:auto;flex:1}
.nav button{width:100%;display:flex;align-items:center;gap:11px;background:none;border:0;color:inherit;padding:9px 10px;border-radius:var(--radius-m);cursor:pointer;text-align:left;font-size:14px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:var(--navy-800);color:#fff;box-shadow:inset 3px 0 0 #7FA8E3}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .badge-count{margin-left:auto;background:#A3382A;color:#fff;border-radius:10px;font-size:11px;padding:0 6px;font-weight:600}
.collapsed .nav-label,.collapsed .brand-name,.collapsed .badge-count,.collapsed .side-foot span{display:none}
.collapsed .nav button{justify-content:center}
.side-foot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#9FB0C8;display:flex;gap:8px;align-items:center}
.side-foot button{background:none;border:0;color:#C8D3E3;cursor:pointer;padding:6px;border-radius:6px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar h1{margin-right:auto;white-space:nowrap}
.icon-btn.menu-btn{display:none}
.content{padding:20px;overflow:auto;flex:1;min-height:0}
.content-inner{max-width:1440px;margin:0 auto}
.demo-banner{background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line);padding:6px 20px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo-banner strong{font-weight:600}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:var(--radius-m);cursor:pointer;font-weight:500;font-size:13.5px;line-height:1.3;white-space:nowrap;min-height:34px}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn-primary{color:#0B1526}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#0B1526}}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn-ghost{background:none;border-color:transparent}
.btn-ghost:hover{background:var(--neutral-soft);border-color:transparent}
.btn-sm{padding:4px 9px;min-height:28px;font-size:12.5px}
.icon-btn{border:0;background:none;padding:7px;border-radius:var(--radius-m);cursor:pointer;color:var(--ink-2);display:inline-grid;place-items:center;position:relative}
.icon-btn:hover{background:var(--neutral-soft)}
.icon-btn svg{width:19px;height:19px}
.dot-count{position:absolute;top:1px;right:0;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:0 4px;min-width:16px;line-height:16px;text-align:center}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-m);padding:7px 10px;min-height:34px;width:100%;color:var(--ink)}
textarea.input{min-height:76px;resize:vertical;line-height:1.45}
.input:focus{border-color:var(--accent);box-shadow:var(--focus);outline:none}
.input[aria-invalid="true"]{border-color:var(--bad)}
.input-sm{min-height:30px;padding:4px 8px;font-size:13px}
.topbar .input{width:auto;min-width:150px}
.search{position:relative}
.search .input{padding-left:30px;min-width:220px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;min-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:40}
.search-results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line-2)}
.search-results button:hover,.search-results button.active{background:var(--accent-soft)}
.search-results small{color:var(--muted);display:block}
label.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.req::after{content:" *";color:var(--bad)}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.err{font-size:12.5px;color:var(--bad);margin-top:4px;display:flex;gap:4px}
.err::before{content:"!";font-weight:700;border:1.5px solid currentColor;border-radius:50%;width:15px;height:15px;font-size:10px;display:inline-grid;place-items:center;flex:none;margin-top:2px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.fgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.fgrid .span2{grid-column:span 2} .fgrid .span3{grid-column:1/-1}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.radio-row{display:flex;flex-wrap:wrap;gap:8px}
.radio-pill{display:flex;gap:6px;align-items:center;border:1px solid var(--line);padding:6px 11px;border-radius:var(--radius-m);cursor:pointer;font-size:13.5px}
.radio-pill:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio-pill input{accent-color:var(--accent)}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-h h2{margin-right:auto}
.panel-h .sub{color:var(--muted);font-size:12.5px;width:100%;margin-top:-4px}
.panel-b{padding:14px 16px}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)} .small{font-size:12.5px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:14px}
.filters .f{display:flex;flex-direction:column;gap:3px}
.filters .f label{font-size:11.5px;font-weight:600;color:var(--muted)}
.filters .input{min-width:140px;width:auto}
.page-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin:2px 0 0;max-width:70ch}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.note{background:var(--surface-2);border:1px solid var(--line-2);border-left:3px solid var(--accent);border-radius:var(--radius-m);padding:10px 12px;font-size:13px;color:var(--ink-2)}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-left-color:var(--bad);background:var(--bad-soft)}

/* ---------- KPI strip ---------- */
.kpi-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.kpi{border:0;background:none;text-align:left;padding:14px 16px 13px;cursor:pointer;border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.kpi:last-child{border-right:0}
.kpi:hover{background:var(--surface-2)}
.kpi .k-label{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .k-value{font-size:1.75rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .k-sub{font-size:12px;color:var(--muted)}
.kpi.alert .k-value{color:var(--bad)}
.kpi.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bad)}
.kpi.caution::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--warn)}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12.5px;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
table.t th button{background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:0;display:inline-flex;gap:4px;align-items:center}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-2)}
table.t td.num,table.t th.num{text-align:right}
table.t .group-h th{background:var(--surface);border-bottom:0;font-size:11.5px;color:var(--muted);padding-bottom:0}
.t-title{font-weight:500}
.t-sub{color:var(--muted);font-size:12px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 12px;font-size:13px;color:var(--muted)}

/* ---------- badges ---------- */
.b{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--neutral-soft);color:var(--ink-2);line-height:1.5}
.b::before{content:"";width:7px;height:7px;flex:none;background:currentColor}
.b.ok{background:var(--ok-soft);color:var(--ok)} .b.ok::before{border-radius:50%}
.b.warn{background:var(--warn-soft);color:var(--warn)} .b.warn::before{transform:rotate(45deg);width:6px;height:6px}
.b.bad{background:var(--bad-soft);color:var(--bad)} .b.bad::before{clip-path:polygon(50% 0,100% 100%,0 100%);width:8px;height:8px}
.b.info{background:var(--info-soft);color:var(--info)} .b.info::before{border-radius:50%;background:none;border:2px solid currentColor;width:8px;height:8px}
.b.plain::before{display:none}
.b.syn{background:var(--warn-soft);color:var(--warn)} .b.syn::before{display:none}

/* ---------- sync pill ---------- */
.sync{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 9px;font-size:12.5px;background:var(--surface);cursor:pointer;color:var(--ink-2);white-space:nowrap}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.sync[data-state="syncing"] i{background:var(--info);animation:pulse 1s infinite}
.sync[data-state="pending"] i{background:var(--warn);border-radius:1px;transform:rotate(45deg)}
.sync[data-state="failed"] i,.sync[data-state="conflict"] i{background:var(--bad);border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.sync[data-state="offline"] i{background:var(--muted)}
@keyframes pulse{50%{opacity:.35}}
.user-chip{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:3px 6px;border-radius:var(--radius-m);text-align:left}
.user-chip:hover{background:var(--neutral-soft)}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar{position:relative;overflow:hidden;width:30px;height:30px;border-radius:50%;background:var(--navy-600);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.user-chip .u-name{font-size:13px;font-weight:600;line-height:1.1;display:block}
.user-chip .u-role{font-size:11.5px;color:var(--muted)}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:var(--shadow);min-width:260px;z-index:50;padding:6px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--neutral-soft)}
.menu .menu-h{padding:8px 10px;border-bottom:1px solid var(--line-2);margin-bottom:4px;font-size:12.5px;color:var(--muted)}
.rel{position:relative}

/* ---------- priority ledger ---------- */
.ledger{list-style:none;margin:0;padding:0}
.ledger li{display:grid;grid-template-columns:4px 1fr auto;gap:0 12px;border-bottom:1px solid var(--line-2)}
.ledger li:last-child{border-bottom:0}
.ledger .rail{background:var(--line)}
.ledger li[data-sev="High"] .rail{background:var(--bad)}
.ledger li[data-sev="Medium"] .rail{background:var(--warn)}
.ledger li[data-sev="Low"] .rail{background:var(--info)}
.ledger .l-body{padding:9px 0;min-width:0}
.ledger .l-type{font-weight:600;font-size:13.5px}
.ledger .l-meta{font-size:12.5px;color:var(--muted)}
.ledger .l-act{align-self:center;padding-right:12px}
.sev{font-size:11px;font-weight:700;margin-right:6px;color:var(--muted)}
.ledger li[data-sev="High"] .sev{color:var(--bad)}
.ledger li[data-sev="Medium"] .sev{color:var(--warn)}

/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .grid-line{stroke:var(--line-2)}
.chart .bar{fill:var(--accent);cursor:pointer}
.chart .bar:hover,.chart .bar:focus{fill:var(--accent-strong);outline:none}
.chart .bar2{fill:var(--navy-600);opacity:.35;pointer-events:none}
:root[data-theme="dark"] .chart .bar2{fill:#9BB6DD}
.chart .line{fill:none;stroke:var(--ok);stroke-width:2}
.chart .pt{fill:var(--ok)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;display:inline-block;border-radius:2px}
.hbars{display:flex;flex-direction:column;gap:6px}
.hbar{display:grid;grid-template-columns:minmax(110px,38%) 1fr 44px;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:3px 4px;border-radius:6px;cursor:pointer;font-size:13px}
.hbar:hover{background:var(--surface-2)}
.hbar .track{height:10px;background:var(--neutral-soft);border-radius:5px;overflow:hidden}
.hbar .fill{display:block;height:100%;background:var(--accent);border-radius:5px}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.hbar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--neutral-soft);margin:6px 0 12px}
.segbar span{display:block;height:100%}
.fu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fu-cell{border:1px solid var(--line-2);border-radius:var(--radius-m);padding:8px 10px;background:none;text-align:left;cursor:pointer}
.fu-cell:hover{border-color:var(--muted)}
.fu-cell b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.fu-cell small{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.fu-cell small i{width:9px;height:9px;display:inline-block;border-radius:2px}
.minibar{height:6px;background:var(--neutral-soft);border-radius:3px;overflow:hidden;min-width:60px}
.minibar span{display:block;height:100%;background:var(--accent)}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(9,18,32,.48);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px calc(4vh + env(safe-area-inset-bottom,0px));z-index:60;overflow:auto}
.modal{background:var(--surface);border-radius:var(--radius-l);box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:640px;display:flex;flex-direction:column;max-height:none;border:1px solid var(--line)}
.modal.lg{max-width:980px} .modal.xl{max-width:1180px}
.modal-h{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.modal-h h2{font-size:1.12rem;margin-right:auto}
.modal-h .sub{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
.modal-b{padding:18px 20px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:13px 20px;border-top:1px solid var(--line-2);flex-wrap:wrap;align-items:center;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 var(--radius-l) var(--radius-l)}
.modal-f .left{margin-right:auto;color:var(--muted);font-size:12.5px}

/* ---------- coaching form ---------- */
.form-layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px}
.steps{list-style:none;margin:0;padding:0;position:sticky;top:0;align-self:start;counter-reset:step}
.steps button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:var(--radius-m);cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.steps button::before{counter-increment:step;content:counter(step);width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}
.steps button[aria-current="step"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.steps button[aria-current="step"]::before{border-color:var(--accent);background:var(--accent);color:#fff}
.steps button.has-err::after{content:"needs attention";margin-left:auto;font-size:10.5px;color:var(--bad);font-weight:600}
.fsec{display:none} .fsec.on{display:block}
.fsec h3{margin-bottom:4px} .fsec .sec-intro{color:var(--muted);font-size:13px;margin-bottom:14px}
.csec{border-top:1px solid var(--line-2);padding-top:16px;margin-top:18px}
.csec:first-of-type{border-top:0;padding-top:0;margin-top:4px}
.csec > h3{margin-bottom:12px}
.item-row.simple{grid-template-columns:minmax(0,1fr) 160px 140px 84px}
.item-row.simple.nostatus{grid-template-columns:minmax(0,1fr) 160px 84px}
.item-row.item-head{background:none;border:0;padding:0 8px;font-size:11.5px;font-weight:600;color:var(--muted);margin:4px 0 2px}
.items-list{display:flex;flex-direction:column;gap:8px}
.item-row{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1fr) 150px 140px auto;gap:8px;align-items:start;border:1px solid var(--line-2);border-radius:var(--radius-m);padding:8px;background:var(--surface-2)}
.calc{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--radius-m);padding:9px 12px;font-size:13px}

/* ---------- detail ---------- */
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 18px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:12px;color:var(--muted);font-weight:600}
.dl dd{margin:1px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.dl .wide{grid-column:1/-1}
.sec{border-top:1px solid var(--line-2);padding-top:14px;margin-top:14px}
.sec > h3{margin-bottom:8px}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.timeline li{position:relative;padding:0 0 12px 16px;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 13px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs .cnt{display:inline-block;margin-left:5px;background:var(--neutral-soft);border-radius:9px;padding:0 6px;font-size:11.5px;font-variant-numeric:tabular-nums}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);margin-bottom:4px;font-weight:600}
.loading{padding:40px;text-align:center;color:var(--muted)}
.spinner{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.profile-head{display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.profile-head .avatar{width:52px;height:52px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:var(--radius-m);overflow:hidden}
.stats div{background:var(--surface);padding:10px 12px}
.stats b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.alert-card{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--radius-m);padding:10px 12px;margin-bottom:10px;background:var(--surface)}
.alert-card.reviewed{border-left-color:var(--ok);opacity:.85}
.def-list dt{font-weight:600;margin-top:10px}
.def-list dd{margin:2px 0 0;color:var(--ink-2)}
.def-list code{font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}

/* ---------- toast ---------- */
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:90;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--navy-900);color:#fff;padding:11px 14px;border-radius:var(--radius-m);box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px;display:flex;gap:10px;align-items:flex-start;border-left:4px solid #7FA8E3}
.toast.ok{border-left-color:#6CC59C} .toast.bad{border-left-color:#EE8C7D} .toast.warn{border-left-color:#E3B05A}
.toast button{margin-left:auto;background:none;border:0;color:#C8D3E3;cursor:pointer;font-size:16px;line-height:1}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.login-side{background:var(--navy-950);color:#D5DEEC;padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.login-side::after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border:1px solid rgba(127,168,227,.18);border-radius:50%;box-shadow:0 0 0 60px rgba(127,168,227,.04),0 0 0 120px rgba(127,168,227,.03)}
.login-side h1{font-size:clamp(1.8rem,3.2vw,2.5rem);color:#fff;font-weight:600;letter-spacing:-.02em;max-width:16ch;line-height:1.12}
.login-side p{max-width:46ch;color:#AFBDD2;font-size:15px}
.login-side ul{padding:0;margin:18px 0 0;list-style:none;display:grid;gap:10px;max-width:46ch}
.login-side li{padding-left:16px;position:relative;color:#C4D0E1}
.login-side li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;background:#7FA8E3;border-radius:1px}
.login-main{padding:48px clamp(20px,4vw,56px);display:flex;flex-direction:column;justify-content:center;gap:22px;max-width:620px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:20px;box-shadow:var(--shadow)}
.demo-users{display:grid;gap:8px;margin-top:10px}
.demo-user{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--radius-m);padding:8px 10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.demo-user:hover{border-color:var(--accent);background:var(--accent-soft)}
.demo-user small{display:block;color:var(--muted)}


/* ---------- QA scorecard form ---------- */
.audit-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.score-panel{position:sticky;top:calc(64px + env(safe-area-inset-top,0px))}
.score-big{font-size:2.6rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.score-bar{height:8px;background:var(--neutral-soft);border-radius:4px;overflow:hidden;margin:10px 0}
.score-bar span{display:block;height:100%;background:var(--muted);transition:width .2s}
.sec-sum{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line-2);gap:8px}
.sec-sum b{font-variant-numeric:tabular-nums}
.sec-sum .bad{color:var(--bad)} .sec-sum .ok{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}

/* rounded cells, readable: whole-row stripes, even 3px gaps, quiet rest days, today outlined */
.sg2-row{gap:3px;margin-top:0;padding:3px 4px;grid-template-columns:220px repeat(14,minmax(0,1fr));border-radius:10px;border-bottom:0}

.sg2-c:hover{outline:2px solid var(--accent);outline-offset:1px;z-index:1}

  ACT.demoResetLogin = function () { confirmDialog({ title: 'Reset demo data?', message: 'This regenerates the synthetic dataset in this browser. It never touches Google Sheets.', ok: 'Reset demo data', danger: true }).then(function (r) { if (!r) return; S.demoT.reset(); clearDemoKeys(); renderLogin(); toast('Demo data reset.', 'ok'); }); };

  // ================= menus: user, bell, search =================
  function dropMenu(anchor, html) { $$('.menu').forEach(function (m) { m.remove(); }); var d = document.createElement('div'); d.className = 'menu'; d.innerHTML = html; anchor.parentNode.appendChild(d); var b = d.querySelector('button'); if (b) b.focus(); return d; }
  ACT.toggleUser = function (el) {
    if (el.parentNode.querySelector('.menu')) { el.parentNode.querySelector('.menu').remove(); return; }
    var theme = document.documentElement.dataset.theme || 'system';
    dropMenu(el, '<div class="menu-h"><strong>' + esc(S.user.displayName) + '</strong><br>' + esc(S.user.email) + '<br>' + esc(S.user.roleLabel) + '</div>' +
      '<button data-act="cycleTheme">Theme: ' + esc(theme) + '</button>' + (S.mode === 'demo' ? '<button data-act="signOut">Switch demo user</button>' : '') + '<button data-act="signOut">Sign out</button>');
  };
  ACT.cycleTheme = function () { var r = document.documentElement, n = { system: 'light', light: 'dark', dark: 'system' }[r.dataset.theme || 'system']; if (n === 'system') delete r.dataset.theme; else r.dataset.theme = n; lsSet('ags_theme', n); $$('.menu').forEach(function (m) { m.remove(); }); toast('Theme: ' + n + '.'); };
  ACT.signOut = function () {
    $$('.menu').forEach(function (m) { m.remove(); });
    var doIt = function () { closeAllModals(); if (S.mode === 'http') Auth.signOut(); if (S.mode === 'gas') { $('#app').innerHTML = '<div class="login-main" style="margin:auto"><div class="login-card"><h2>Signed out of this page</h2><p>This copy of the app uses your Google session. To switch accounts, sign out of Google, then reload.</p><button class="btn" onclick="location.reload()">Reload</button></div></div>'; S.user = null; return; } S.user = null; S.data = null; location.hash = ''; renderLogin(); };
    if (S.sync.pending.length) confirmDialog({ title: 'Sign out with pending changes?', message: plural(S.sync.pending.length, 'change') + ' have not reached the server. They stay queued in this browser and can be retried after you sign in again.', ok: 'Sign out' }).then(function (r) { if (r) doIt(); });
    else doIt();
  };
  INP.gsearch = debounce(function (el) {
    var box = $('#gsearch-res'), q = el.value.trim().toLowerCase(); box.innerHTML = ''; if (q.length < 2) { el.setAttribute('aria-expanded', 'false'); return; }
    var res = [];
    S.data.agents.filter(C.live).forEach(function (a) { if ((a.FullName + ' ' + a.EmployeeID + ' ' + a.AgentID).toLowerCase().indexOf(q) >= 0) res.push(['agent', a.AgentID, a.FullName, 'Agent, ' + campName(a.CampaignID)]); });
    S.data.audits.filter(C.live).forEach(function (a) { if ((a.AuditID + ' ' + (a.InteractionID || '')).toLowerCase().indexOf(q) >= 0) res.push(['audit', a.AuditID, a.AuditID + ': ' + agName(a.AgentID), (a.ScorecardName || '') + ', ' + fmtDate(a.AuditDate)]); });
    var d = document.createElement('div'); d.className = 'search-results'; d.setAttribute('role', 'listbox'); d.id = 'gsearch-list';
    d.innerHTML = res.length ? res.slice(0, 12).map(function (r) { return '<button role="option" data-act="searchPick" data-type="' + r[0] + '" data-id="' + esc(r[1]) + '">' + esc(r[2]) + '<small>' + esc(r[3]) + '</small></button>'; }).join('') : '<div class="empty" style="padding:12px">No matches</div>';
    box.appendChild(d); el.setAttribute('aria-expanded', 'true');
  }, 150);
  document.addEventListener('keydown', function (e) {
    if (e.target.id === 'gsearch') {
      if (e.key === 'ArrowDown') { var b = $('#gsearch-res button'); if (b) { e.preventDefault(); b.focus(); } }
      if (e.key === 'Enter') { var f = $('#gsearch-res button'); if (f) { e.preventDefault(); f.click(); } }
      if (e.key === 'Escape') { $('#gsearch-res').innerHTML = ''; }
    } else if (e.target.closest && e.target.closest('#gsearch-res') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault(); var n = e.key === 'ArrowDown' ? e.target.nextElementSibling : e.target.previousElementSibling; if (n) n.focus(); else if (e.key === 'ArrowUp') $('#gsearch').focus();
    }
  });
  ACT.searchPick = function (el) {
    $('#gsearch-res').innerHTML = ''; $('#gsearch').value = '';
    pf('settings', { tab: 'agents' }).tab = 'agents'; go('settings');
  };

  // ================= background refresh =================
  // Every 5 minutes while the tab is visible, and when you return to the tab after 2+ minutes away.
  // Never while a dialog or form is open, while typing in the page, or while a save is in progress.
  var AUTO_EVERY = 5 * 60000, AUTO_ON_RETURN = 2 * 60000, autoBusy = false;
  function canAutoRefresh() {
    if (!S.user || !S.transport || autoBusy || modalStack.length || document.visibilityState !== 'visible') return false;
    if (S.sync.state === 'syncing' || (S.mode !== 'demo' && !navigator.onLine)) return false;
    var a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.id !== 'gsearch' && $('#page') && $('#page').contains(a)) return false;
    if ($('.menu,.search-results')) return false;
    return true;
  }
  function autoRefresh() {
    if (!canAutoRefresh()) return;
    autoBusy = true;
    var main = $('#main'), top = main ? main.scrollTop : 0;
    Api.read('bootstrap', { includeArchived: S.showArchived }).then(function (d) {
      autoBusy = false;
      if (modalStack.length) { setData(d); return; }          // a dialog opened meanwhile: update data, redraw later
      setData(d); render(); if (main) main.scrollTop = top;
    }, function () { autoBusy = false; });
  }
  setInterval(function () { if (S.lastLoad && Date.now() - S.lastLoad >= AUTO_EVERY) autoRefresh(); }, 30000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S.lastLoad && Date.now() - S.lastLoad >= AUTO_ON_RETURN) autoRefresh();
  });
  window.__AGS_autoRefreshNow = function () { S.lastLoad = 0; autoRefresh(); };   // used by automated tests only

  // ================= boot =================
  (function () { var t = lsGet('ags_theme', null); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; })();
  window.addEventListener('error', function (e) { if (e && e.message && S.user) toast('Unexpected error: ' + e.message + '. Your saved data is not affected; refresh if the page misbehaves.', 'bad'); });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; if (r && r.code) return; if (S.user) toast('Unexpected error: ' + (r && r.message ? r.message : r), 'bad'); console.error(r); });
  window.addEventListener('beforeunload', function (e) { var m = topModal(); if (m && m._form && m._form.dirty) { e.preventDefault(); e.returnValue = ''; } });
  function boot() {
    if (window.google && google.script && google.script.run) { startServer('gas'); return; }
    if (CFG.API_URL && CFG.GOOGLE_CLIENT_ID && restoreToken()) {
      startServer('http');                       // refresh keeps you signed in for this tab
      Auth.load().catch(function () { });        // ready for re-sign-in when the token expires
      return;
    }
    renderLogin();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
